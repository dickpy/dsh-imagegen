name: ✨ 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 感谢你的建议 💡
        请描述清楚使用场景和期望效果，这有助于我们判断优先级。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下需要这个功能？现在有什么不便？
      placeholder: |
        我在 ... 时，希望 ...
        目前只能 ...，很麻烦。
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望的解决方案
      description: 你希望插件如何工作？（越具体越好）
      placeholder: |
        例如：希望支持批量生成并一键下载所有图片为 zip。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你尝试过哪些变通方法？它们有什么不足？
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 参考截图、参考其他工具的实现、相关链接等（可选）
    validations:
      required: false
