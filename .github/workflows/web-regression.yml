name: Web regression

on:
  push:
    branches: ['fix/**']
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/web-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked project dependencies
        run: |
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
      - name: Install Chromium test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save playwright@1.56.1
          node "$RUNNER_TEMP/browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/browser-tools/node_modules" >> "$GITHUB_ENV"
      - name: Type check and build
        run: |
          pnpm run typecheck
          pnpm run build
      - name: History, sidebar and channel settings in Chromium
        run: pnpm run test:history:browser
      - name: Studio workflows in Chromium
        run: pnpm run test:studio:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-regression-evidence
          path: |
            .test-artifacts/
            /tmp/dsh-117-qa/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14
