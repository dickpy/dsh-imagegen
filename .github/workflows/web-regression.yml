name: Real DSH UI screenshots

on:
  push:
    branches: ['fix/issue-76-real-interface']

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install official DSH and Chromium
        run: |
          npm install --global pnpm@11.25.0
          npm install --prefix "$RUNNER_TEMP/dsh-ui" --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.1 playwright@1.56.1
          node "$RUNNER_TEMP/dsh-ui/node_modules/playwright/cli.js" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
          echo "CODEX_PRIMARY_RUNTIME_NODE_MODULES=$RUNNER_TEMP/dsh-ui/node_modules" >> "$GITHUB_ENV"
          echo "DSH_UI_BINARY=$RUNNER_TEMP/dsh-ui/node_modules/.bin/dsh" >> "$GITHUB_ENV"
          echo "DSH_HOME=$RUNNER_TEMP/dsh-ui-home" >> "$GITHUB_ENV"
      - name: Install published plugin and reference photographs
        run: |
          "$DSH_UI_BINARY" plugin --profile web add @dickpy/dsh-imagegen@1.17.2
          curl --fail --silent --show-error --location --max-time 60 --output "$RUNNER_TEMP/forest-reference.jpg" 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=1200&q=85'
          curl --fail --silent --show-error --location --max-time 60 --output "$RUNNER_TEMP/lake-reference.jpg" 'https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=1200&q=85'
          echo "DSH_UI_FOREST_IMAGE=$RUNNER_TEMP/forest-reference.jpg" >> "$GITHUB_ENV"
          echo "DSH_UI_LAKE_IMAGE=$RUNNER_TEMP/lake-reference.jpg" >> "$GITHUB_ENV"
      - name: Capture the real DSH application
        run: node scripts/capture-real-dsh-ui.mjs
      - name: Upload actual application screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-dsh-ui-screenshots
          path: .test-artifacts/real-dsh-ui/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
